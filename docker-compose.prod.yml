# ============================================================
# XuanMu RedTeam Agent - Docker Compose 生产部署
# 使用方式：
#   1. 复制 .env.example 为 .env 并填写配置
#   2. docker compose -f docker-compose.prod.yml up -d
#   3. 访问 http://localhost:${XUANMU_PORT}
#
# 改端口/数据库密码？只需编辑 .env，无需改其他文件。
#
# 可选启动 pgAdmin：
#   docker compose -f docker-compose.prod.yml --profile admin up -d
# ============================================================

services:
  # ---- 主应用 ----
  app:
    image: xuanmu:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xuanmu-app
    restart: unless-stopped
    ports:
      - "${XUANMU_PORT:-8000}:${XUANMU_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./.xuanmu:/app/.xuanmu
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # 环境变量透传 → config.py 自动覆盖 config.json 中对应字段
      XUANMU_LISTEN_ADDR: "0.0.0.0"
      XUANMU_LISTEN_PORT: "${XUANMU_PORT:-8000}"
      XUANMU_DB_HOST: "postgres"
      XUANMU_DB_PORT: "5432"
      XUANMU_DB_NAME: "${POSTGRES_DB:-z3r0}"
      XUANMU_DB_USER: "${POSTGRES_USER:-root}"
      XUANMU_DB_PASSWORD: "${POSTGRES_PASSWORD:-xuanmu2025}"
      TZ: ${TZ:-Asia/Shanghai}

  # ---- PostgreSQL 数据库 ----
  postgres:
    image: postgres:16-alpine
    container_name: xuanmu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xuanmu2025}
      POSTGRES_DB: ${POSTGRES_DB:-z3r0}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5400}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-z3r0}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- pgAdmin（可选，通过 --profile admin 启用）----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: xuanmu-pgadmin
    restart: unless-stopped
    profiles:
      - admin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@xuanmu.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-xuanmu2025}
      PGADMIN_LISTEN_PORT: 5401
    ports:
      - "${PGADMIN_PORT:-5401}:5401"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: xuanmu-pgdata
  pgadmin_data:
    name: xuanmu-pgadmin-data
